<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <g fill="none" stroke="#525456" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart on the left -->
    <!-- Tilted slightly to the right, resting on beam at (98, 115) -->
    <path d="M 98 115
             C 75 102, 52 75, 52 52
             C 52 35, 66 22, 83 22
             C 94 22, 104 29, 110 38
             C 116 29, 126 22, 137 22
             C 154 22, 168 35, 168 52
             C 168 75, 135 98, 98 115 Z" />

    <!-- Leaf on the right -->
    <!-- Pointed oval tilted 45 deg, base at (208, 115), tip at (272, 36) -->
    <path d="M 208 115
             C 200 80, 225 45, 272 36
             C 280 72, 255 107, 208 115 Z" />
    <!-- Diagonal vein line from base to tip -->
    <line x1="208" y1="115" x2="272" y2="36" />

    <!-- Balance beam resting on fulcrum apex -->
    <line x1="80" y1="115" x2="260" y2="115" stroke-width="7" />

    <!-- Fulcrum triangle -->
    <polygon points="170,115 135,188 205,188" stroke-width="6.5" />
  </g>

  <!-- Text: ETHICALLY SOURCED -->
  <text x="170" y="240" text-anchor="middle" fill="#525456"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="700" letter-spacing="3.5">ETHICALLY</text>
  <text x="170" y="278" text-anchor="middle" fill="#525456"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="700" letter-spacing="3.5">SOURCED</text>
</svg>