<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Top Arc for CLEAN text (radius 142) -->
    <path id="arcClean" d="M 62 200 A 138 138 0 0 1 338 200" fill="none" />
    <!-- Bottom Arc for SCIENCE text (radius 142, left to right clockwise) -->
    <path id="arcScience" d="M 62 200 A 138 138 0 0 0 338 200" fill="none" />
  </defs>

  <!-- Outer Circle -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="#111111" stroke-width="8.5" />

  <!-- Inner Circle enclosing the illustration -->
  <circle cx="200" cy="200" r="106" fill="none" stroke="#111111" stroke-width="7" />

  <!-- Arched Typography in outer ring -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="800" fill="#111111" letter-spacing="5">
    <textPath href="#arcClean" startOffset="50%" text-anchor="middle">CLEAN</textPath>
  </text>

  <text font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-size="33" font-weight="800" fill="#111111" letter-spacing="4.5">
    <textPath href="#arcScience" startOffset="50%" text-anchor="middle">SCIENCE</textPath>
  </text>

  <!-- Central Erlenmeyer Flask with Sprouting Leaves inside inner circle -->
  <g fill="none" stroke="#111111" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flask Lip / Rim -->
    <line x1="188" y1="182" x2="212" y2="182" stroke-width="6" />

    <!-- Flask Neck & Conical Body -->
    <path d="M 191 182 L 191 204 L 168 250 C 166 254, 169 258, 175 258 L 225 258 C 231 258, 234 254, 232 250 L 209 204 L 209 182" />

    <!-- Liquid Meniscus Line -->
    <line x1="174" y1="238" x2="226" y2="238" stroke-width="5" />

    <!-- Central Vertical Stem between leaves -->
    <line x1="200" y1="208" x2="200" y2="178" stroke-width="5.5" />

    <!-- Left Sprouting Leaf: organic curve out and back -->
    <path d="M 200 180 C 196 156, 174 138, 142 138 C 142 166, 166 180, 200 180 Z" />

    <!-- Right Sprouting Leaf: organic curve out and back -->
    <path d="M 200 180 C 204 156, 226 138, 258 138 C 258 166, 234 180, 200 180 Z" />
  </g>
</svg>